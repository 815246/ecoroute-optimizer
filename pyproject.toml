[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["backend/database/migrations", "database/migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "algorithms", "services", "api", "database", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=agents --cov=algorithms --cov-report=term-missing --cov-fail-under=0"
markers = [
    "network: marks tests that require network access (deselect with '-m not network')",
    "slow: marks slow tests",
]

[tool.coverage.run]
source = ["backend/agents", "backend/algorithms", "agents", "algorithms"]
omit = ["*/migrations/*", "*/__init__.py", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
